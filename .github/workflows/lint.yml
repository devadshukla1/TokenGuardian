name: Schema and Config Lint

on:
  push:
    branches: [ main ]
    paths:
      - '**/*.json'
      - '**/*.yml'
      - '**/*.yaml'
  pull_request:
    branches: [ main ]
    paths:
      - '**/*.json'
      - '**/*.yml'
      - '**/*.yaml'

jobs:
  lint-configs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validate JSON Manifests
        run: |
          for f in $(find . -name "*.json" -not -path "./node_modules/*"); do
            echo "Validating $f..."
            node -e "JSON.parse(require('fs').readFileSync('$f', 'utf8'))"
          done
